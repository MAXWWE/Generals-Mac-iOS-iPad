name: Build GeneralsZH iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init iOS DXVK submodule
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Install toolchain dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen

      - name: Install LunarG Vulkan SDK
        run: |
          VULKAN_VER=$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt | tr -d '[:space:]')
          echo "Installing LunarG Vulkan SDK $VULKAN_VER"
          SDK_DIR="$HOME/VulkanSDK/$VULKAN_VER"
          MOUNTED=0
          if curl -fsSL -o vulkansdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip"; then
            unzip -q vulkansdk.zip -d vulkansdk_unpack
            INSTALLER=$(find vulkansdk_unpack -maxdepth 2 -name "*.app" | head -n 1)
          else
            curl -fsSL -o vulkansdk.dmg "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.dmg"
            hdiutil attach vulkansdk.dmg -mountpoint /Volumes/VulkanSDK
            MOUNTED=1
            INSTALLER=$(find /Volumes/VulkanSDK -maxdepth 2 -name "*.app" | head -n 1)
          fi
          INSTALLER_BIN=$(find "$INSTALLER/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)
          "$INSTALLER_BIN" --root "$SDK_DIR" --accept-licenses --default-answer --confirm-command install
          if [ ! -f "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" ]; then
            FOUND_XC=$(find "$SDK_DIR" -type d -name "MoltenVK.xcframework" | head -n 1)
            if [ -z "$FOUND_XC" ]; then
              "$INSTALLER_BIN" --root "${SDK_DIR}-ios" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.ios || true
              FOUND_XC=$(find "${SDK_DIR}-ios" -type d -name "MoltenVK.xcframework" | head -n 1)
            fi
            if [ -n "$FOUND_XC" ]; then
              mkdir -p "$SDK_DIR/macOS/lib"
              cp -a "$FOUND_XC" "$SDK_DIR/macOS/lib/"
            fi
          fi
          [ "$MOUNTED" -eq 1 ] && hdiutil detach /Volumes/VulkanSDK || true
          mkdir -p "$SDK_DIR/vulkan-headers-only"
          VULK_INC=$(find "$SDK_DIR" -path "*/include/vulkan/vulkan.h" -print -quit \vert{} sed 's\vert{}/vulkan/vulkan.h$||')
          if [ -n "$VULK_INC" ]; then
            for d in vulkan vk_video spirv; do
              if [ -d "$VULK_INC/$d" ]; then
                cp -a "$VULK_INC/$d" "$SDK_DIR/vulkan-headers-only/"
              fi
            done
          fi
          ls -la "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          ls -la "$SDK_DIR/vulkan-headers-only/vulkan/vulkan.h"
          echo "VULKAN_SDK=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "VULKAN_SDK_ROOT=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "CPATH=$SDK_DIR/vulkan-headers-only" >> "$GITHUB_ENV"
          echo "$SDK_DIR/macOS/bin" >> "$GITHUB_PATH"

      - name: Setup full vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch MoltenVK and stage fonts
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure and build Zero Hour engine for iOS ARM64
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Build unsigned iOS app bundle
        run: |
          cd ios
          xcodegen generate
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" \vert{} awk '/Schemes:/{getline; gsub(/^[ \t]+\vert{}[ \t]+$/, ""); print; exit}')
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Stage binaries and package unsigned IPA
        run: |
          APP_PATH=$(find build/ios-xcode/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found XcodeGen app bundle: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"

          BUILT_BIN=$(find build/ios-vulkan -type f \( -name "GeneralsXZH" -o -name "z_generals" \) | head -n 1)
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "GeneralsXZH")
          echo "Staging binary $BUILT_BIN to $APP_PATH/$EXEC_NAME"
          cp -f "$BUILT_BIN" "$APP_PATH/$EXEC_NAME"
          chmod +x "$APP_PATH/$EXEC_NAME"

          # Copy all valid ARM64 dylibs (SDL3, SDL3_image, OpenAL, DXVK, etc.)
          find build/ios-vulkan ios references -name "*.dylib" 2>/dev/null | while IFS= read -r f; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              if file -L "$f" | grep -q "Mach-O.*arm64"; then
                base=$(basename "$f")
                case "$base" in
                  *MoltenVK*|*vulkan*) continue ;;
                esac
                cp -fL "$f" "$APP_PATH/Frameworks/$base"
              fi
            fi
          done

          # Bundle a real iOS ARM64 dynamic MoltenVK for DXVK and SDL3 Vulkan
          MVK_DYLIB=""
          while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            if file -L "$candidate" | grep -q "dynamically linked shared library arm64"; then
              if vtool -show-build "$candidate" 2>/dev/null \vert{} grep -qiE "platform[[:space:]]+IOS([[:space:]]\vert{}$)"; then
                MVK_DYLIB="$candidate"
                echo "Found existing iOS ARM64 dynamic MoltenVK: $MVK_DYLIB"
                break
              fi
            fi
          done < <(find build ios references "$VULKAN_SDK" -maxdepth 6 ! -path "*simulator*" \( -name "libMoltenVK.dylib" -o -name "MoltenVK" \) -type f 2>/dev/null)

          if [ -z "$MVK_DYLIB" ]; then
            MVK_STATIC=""
            if [ -f "$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" ]; then
              MVK_STATIC="$VULKAN_SDK/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
            else
              while IFS= read -r candidate; do
                [ -f "$candidate" ] || continue
                if file -L "$candidate" | grep -qi "ar archive"; then
                  MVK_STATIC="$candidate"
                  break
                fi
              done < <(find "$VULKAN_SDK" build ios references -maxdepth 6 -path "*/ios-arm64/*" ! -path "*simulator*" \( -name "libMoltenVK.a" -o -name "MoltenVK" \) -type f 2>/dev/null)
            fi

            if [ -n "$MVK_STATIC" ]; then
              echo "Found static iOS ARM64 MoltenVK: $MVK_STATIC"
              IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
              clang++ -shared -arch arm64 -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 \
                -Wl,-force_load,"$MVK_STATIC" \
                -framework Metal -framework Foundation -framework QuartzCore -framework UIKit \
                -framework IOSurface -framework CoreGraphics -framework CoreFoundation \
                -weak_framework CoreVideo -weak_framework MetalFX \
                -install_name "@rpath/libMoltenVK.dylib" \
                -o "$APP_PATH/Frameworks/libMoltenVK.dylib"
            else
              echo "ERROR: Could not find iOS ARM64 MoltenVK!"
              exit 1
            fi
          else
            cp -fL "$MVK_DYLIB" "$APP_PATH/Frameworks/libMoltenVK.dylib"
          fi

          echo "=== Verifying MoltenVK exports ==="
          nm -gU "$APP_PATH/Frameworks/libMoltenVK.dylib" | grep "vkGetInstanceProcAddr" | head -n 5

          # Provide all standard Vulkan names DXVK / SDL3 may dlopen on iOS
          cp -fL "$APP_PATH/Frameworks/libMoltenVK.dylib" "$APP_PATH/Frameworks/libvulkan.1.dylib"
          cp -fL "$APP_PATH/Frameworks/libMoltenVK.dylib" "$APP_PATH/Frameworks/libvulkan.dylib"

          # Also create a clean MoltenVK.framework with valid Info.plist
          rm -rf "$APP_PATH/Frameworks/MoltenVK.framework"
          mkdir -p "$APP_PATH/Frameworks/MoltenVK.framework"
          cp -fL "$APP_PATH/Frameworks/libMoltenVK.dylib" "$APP_PATH/Frameworks/MoltenVK.framework/MoltenVK"
          MVK_PLIST="$APP_PATH/Frameworks/MoltenVK.framework/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string MoltenVK" "$MVK_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string org.khronos.MoltenVK" "$MVK_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleInfoDictionaryVersion string 6.0" "$MVK_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string MoltenVK" "$MVK_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundle
