name: Build GeneralsZH iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init iOS DXVK submodule
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Install toolchain dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen

      - name: Install LunarG Vulkan SDK
        run: |
          curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt -o /tmp/vk_ver.txt
          VULKAN_VER=$(tr -d '[:space:]' < /tmp/vk_ver.txt)
          echo "Installing LunarG Vulkan SDK $VULKAN_VER"
          SDK_DIR="$HOME/VulkanSDK/$VULKAN_VER"
          MOUNTED=0
          if curl -fsSL -o vulkansdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip"; then
            unzip -q vulkansdk.zip -d vulkansdk_unpack
            INSTALLER=$(find vulkansdk_unpack -maxdepth 2 -name "*.app" -print -quit)
          else
            curl -fsSL -o vulkansdk.dmg "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.dmg"
            hdiutil attach vulkansdk.dmg -mountpoint /Volumes/VulkanSDK
            MOUNTED=1
            INSTALLER=$(find /Volumes/VulkanSDK -maxdepth 2 -name "*.app" -print -quit)
          fi
          INSTALLER_BIN=$(find "$INSTALLER/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print -quit)
          "$INSTALLER_BIN" --root "$SDK_DIR" --accept-licenses --default-answer --confirm-command install
          if [ ! -f "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" ]; then
            FOUND_XC=$(find "$SDK_DIR" -type d -name "MoltenVK.xcframework" -print -quit)
            if [ -z "$FOUND_XC" ]; then
              if ! "$INSTALLER_BIN" --root "${SDK_DIR}-ios" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.ios; then true; fi
              FOUND_XC=$(find "${SDK_DIR}-ios" -type d -name "MoltenVK.xcframework" -print -quit)
            fi
            if [ -n "$FOUND_XC" ]; then
              mkdir -p "$SDK_DIR/macOS/lib"
              cp -a "$FOUND_XC" "$SDK_DIR/macOS/lib/"
            fi
          fi
          if [ "$MOUNTED" -eq 1 ]; then
            if ! hdiutil detach /Volumes/VulkanSDK; then true; fi
          fi
          mkdir -p "$SDK_DIR/vulkan-headers-only"
          VULK_H=$(find "$SDK_DIR" -path "*/include/vulkan/vulkan.h" -print -quit)
          VULK_INC="${VULK_H%/vulkan/vulkan.h}"
          if [ -n "$VULK_INC" ]; then
            for d in vulkan vk_video spirv; do
              if [ -d "$VULK_INC/$d" ]; then
                cp -a "$VULK_INC/$d" "$SDK_DIR/vulkan-headers-only/"
              fi
            done
          fi
          ls -la "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          ls -la "$SDK_DIR/vulkan-headers-only/vulkan/vulkan.h"
          echo "VULKAN_SDK=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "VULKAN_SDK_ROOT=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "CPATH=$SDK_DIR/vulkan-headers-only" >> "$GITHUB_ENV"
          echo "$SDK_DIR/macOS/bin" >> "$GITHUB_PATH"

      - name: Setup full vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch MoltenVK and stage fonts
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure and build Zero Hour engine for iOS ARM64
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Build unsigned iOS app bundle
        run: |
          cd ios
          xcodegen generate
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          xcodebuild -list -project "$PROJ" > /tmp/xc_list.txt
          SCHEME=$(awk '/Schemes:/{getline; gsub(/^[ \t]+/, ""); gsub(/[ \t]+$/, ""); print; exit}' /tmp/xc_list.txt)
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Stage binaries and package unsigned IPA
        run: |
          APP_PATH=$(find build/ios-xcode/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" -print -quit)
          echo "Found XcodeGen app bundle: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"

          BUILT_BIN=$(find build/ios-vulkan -type f \( -name "GeneralsXZH" -o -name "z_generals" \) -print -quit)
          EXEC_NAME=""
          if val=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null); then
            EXEC_NAME="$val"
          fi
          if [ -z "$EXEC_NAME" ]; then
            EXEC_NAME="GeneralsXZH"
          fi
          echo "Staging binary $BUILT_BIN to
