name: Build GeneralsZH iOS Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init iOS DXVK submodule
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk

      - name: Install toolchain dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen

      - name: Install LunarG Vulkan SDK
        run: |
          VULKAN_VER=$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt | tr -d '[:space:]')
          echo "Installing LunarG Vulkan SDK $VULKAN_VER"
          SDK_DIR="$HOME/VulkanSDK/$VULKAN_VER"
          MOUNTED=0
          if curl -fsSL -o vulkansdk.zip "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.zip"; then
            unzip -q vulkansdk.zip -d vulkansdk_unpack
            INSTALLER=$(find vulkansdk_unpack -maxdepth 2 -name "*.app" | head -n 1)
          else
            curl -fsSL -o vulkansdk.dmg "https://sdk.lunarg.com/sdk/download/${VULKAN_VER}/mac/vulkansdk-macos-${VULKAN_VER}.dmg"
            hdiutil attach vulkansdk.dmg -mountpoint /Volumes/VulkanSDK
            MOUNTED=1
            INSTALLER=$(find /Volumes/VulkanSDK -maxdepth 2 -name "*.app" | head -n 1)
          fi
          INSTALLER_BIN=$(find "$INSTALLER/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -n 1)
          "$INSTALLER_BIN" --root "$SDK_DIR" --accept-licenses --default-answer --confirm-command install
          if [ ! -f "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a" ]; then
            FOUND_XC=$(find "$SDK_DIR" -type d -name "MoltenVK.xcframework" | head -n 1)
            if [ -z "$FOUND_XC" ]; then
              "$INSTALLER_BIN" --root "${SDK_DIR}-ios" --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.ios || true
              FOUND_XC=$(find "${SDK_DIR}-ios" -type d -name "MoltenVK.xcframework" | head -n 1)
            fi
            if [ -n "$FOUND_XC" ]; then
              mkdir -p "$SDK_DIR/macOS/lib"
              cp -a "$FOUND_XC" "$SDK_DIR/macOS/lib/"
            fi
          fi
          [ "$MOUNTED" -eq 1 ] && hdiutil detach /Volumes/VulkanSDK || true
          mkdir -p "$SDK_DIR/vulkan-headers-only"
          VULK_INC=$(find "$SDK_DIR" -path "*/include/vulkan/vulkan.h" -print -quit | sed 's|/vulkan/vulkan.h$||')
          if [ -n "$VULK_INC" ]; then
            for d in vulkan vk_video spirv; do
              if [ -d "$VULK_INC/$d" ]; then
                cp -a "$VULK_INC/$d" "$SDK_DIR/vulkan-headers-only/"
              fi
            done
          fi
          ls -la "$SDK_DIR/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          ls -la "$SDK_DIR/vulkan-headers-only/vulkan/vulkan.h"
          echo "VULKAN_SDK=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "VULKAN_SDK_ROOT=$SDK_DIR/macOS" >> "$GITHUB_ENV"
          echo "CPATH=$SDK_DIR/vulkan-headers-only" >> "$GITHUB_ENV"
          echo "$SDK_DIR/macOS/bin" >> "$GITHUB_PATH"

      - name: Setup full vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch MoltenVK and stage fonts
        run: |
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure and build Zero Hour engine for iOS ARM64
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Build unsigned iOS app bundle
        run: |
          cd ios
          xcodegen generate
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{getline; gsub(/^[ \t]+|[ \t]+$/, ""); print; exit}')
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Stage binaries and package unsigned IPA
        run: |
          APP_PATH=$(find build/ios-xcode/Build/Products/Release-iphoneos -maxdepth 2 -name "*.app" | head -n 1)
          echo "Found XcodeGen app bundle: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"

          BUILT_BIN=$(find build/ios-vulkan -type f \( -name "GeneralsXZH" -o -name "z_generals" \) | head -n 1)
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || echo "GeneralsXZH")
          echo "Staging binary $BUILT_BIN to $APP_PATH/$EXEC_NAME"
          cp -f "$BUILT_BIN" "$APP_PATH/$EXEC_NAME"
          chmod +x "$APP_PATH/$EXEC_NAME"

          # Copy all valid, non-empty ARM64 dylibs (SDL3, SDL3_image, OpenAL, DXVK, etc.) without broken symlinks
          find build/ios-vulkan ios references -name "*.dylib" 2>/dev/null | while IFS= read -r f; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              if file -L "$f" | grep -q "Mach-O.*arm64"; then
                base=$(basename "$f")
                cp -fL "$f" "$APP_PATH/Frameworks/$base"
              fi
            fi
          done

          # Copy MoltenVK.framework if present
          find build/ios-vulkan ios -name "MoltenVK.framework" -type d 2>/dev/null | while IFS= read -r fw; do
            cp -RfL "$fw" "$APP_PATH/Frameworks/"
          done

          # Remove any symlinks or 0-byte files so ESign packaging never fails
          find "$APP_PATH/Frameworks" -type l -delete 2>/dev/null || true
          find "$APP_PATH/Frameworks" -type f -size 0 -delete 2>/dev/null || true

          # Fix RPATHs and hardcoded build paths on main binary and all dylibs
          fix_macho() {
            local target="$1"
            codesign --remove-signature "$target" 2>/dev/null || true
            otool -l "$target" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}' | while IFS= read -r rp; do
              case "$rp" in
                /Users/*|/opt/*)
                  install_name_tool -delete_rpath "$rp" "$target" 2>/dev/null || true
                  ;;
              esac
            done
            install_name_tool -add_rpath "@executable_path/Frameworks" "$target" 2>/dev/null || true
            install_name_tool -add_rpath "@loader_path" "$target" 2>/dev/null || true
            otool -L "$target" | awk 'NR>1 {print $1}' | while IFS= read -r dep; do
              case "$dep" in
                /Users/*|/opt/*)
                  dep_base=$(basename "$dep")
                  if [ -f "$APP_PATH/Frameworks/$dep_base" ]; then
                    install_name_tool -change "$dep" "@rpath/$dep_base" "$target" 2>/dev/null || true
                  fi
                  ;;
              esac
            done
          }

          fix_macho "$APP_PATH/$EXEC_NAME"
          for d in "$APP_PATH/Frameworks"/*.dylib; do
            [ -f "$d" ] || continue
            chmod +w "$d"
            codesign --remove-signature "$d" 2>/dev/null || true
            install_name_tool -id "@rpath/$(basename "$d")" "$d" 2>/dev/null || true
            fix_macho "$d"
          done

          # Enable iOS Files app folder visibility natively
          /usr/libexec/PlistBuddy -c "Delete :UIFileSharingEnabled" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSSupportsOpeningDocumentsInPlace" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP_PATH/Info.plist"

          [ -d ios/config ] && cp -RfL ios/config/. "$APP_PATH/" || true
          [ -d ios/fonts ] && cp -RfL ios/fonts "$APP_PATH/" || true

          echo "=== Main binary dependencies ==="
          otool -L "$APP_PATH/$EXEC_NAME"
          echo "=== Main binary RPATHs ==="
          otool -l "$APP_PATH/$EXEC_NAME" | awk '/cmd LC_RPATH/{f=1} f && /path /{print $2; f=0}'
          echo "=== Bundled Frameworks ==="
          ls -lh "$APP_PATH/Frameworks"

          rm -rf Payload GeneralsZH-unsigned.ipa
          mkdir -p Payload
          cp -RfL "$APP_PATH" Payload/
          zip -r GeneralsZH-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsZH-iOS-Unsigned-IPA
          path: GeneralsZH-unsigned.ipa
